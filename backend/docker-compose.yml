version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: vazhi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-vazhi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vazhi_dev_password}
      POSTGRES_DB: ${DB_DATABASE:-vazhi}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - vazhi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-vazhi}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vazhi-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - vazhi_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vazhi-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm run migration:run && node dist/main"

volumes:
  vazhi_pg_data:
  vazhi_redis_data:
