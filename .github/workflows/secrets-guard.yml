name: Secrets guard

# S-1: the shared project zip shipped three Android upload keystores and env
# files. This guard fails CI if any secret-like file ever becomes tracked.
# Local equivalent: .githooks/pre-commit (git config core.hooksPath .githooks).
# The only allowed exception is `.env.example` (variable names, no values).
on:
  push:
  pull_request:

jobs:
  no-tracked-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if keystores or env files are tracked
        run: |
          LEAKED="$(git ls-files | grep -E '(^|/)([^/]*\.jks|[^/]*\.keystore|[^/]*\.p12|[^/]*\.p8|[^/]*\.key|[^/]*\.pem|\.env|\.env\..*)$' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$LEAKED" ]; then
            echo "::error::Secret-like files are tracked in git - remove them and rotate the affected keys (see ADMIN.md, S-1):"
            echo "$LEAKED"
            exit 1
          fi
          echo "Clean: no *.jks/*.keystore/*.p12/*.p8/*.key/*.pem or .env* files tracked (.env.example excepted)."

      - name: Fail if build outputs are tracked
        run: |
          LEAKED="$(git ls-files | grep -E '(^|/)(backend/dist/|frontend/dist/|\.expo/|\.claude/|node_modules/)' | head -20 || true)"
          if [ -n "$LEAKED" ]; then
            echo "::error::Build outputs are tracked - gitignore and untrack them:"
            echo "$LEAKED"
            exit 1
          fi
          echo "Clean: no build outputs are tracked."
