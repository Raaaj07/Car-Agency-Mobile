name: Secret guard

# S-1: the project zip once shipped Android upload keystores and env files.
# This guard fails the build if any secret-like file ever becomes tracked:
#   git ls-files '*.jks' '*.env*'   # must be empty
on:
  push:
  pull_request:

jobs:
  no-tracked-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if keystores or env files are tracked
        run: |
          LEAKED="$(git ls-files -- '*.jks' '*.env*' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$LEAKED" ]; then
            echo "::error::Secret-like files are tracked in git — remove them and rotate the affected keys:"
            echo "$LEAKED"
            exit 1
          fi
          echo "Clean: no *.jks or *.env* files are tracked."

      - name: Fail if build outputs are tracked
        run: |
          LEAKED="$(git ls-files -- 'backend/dist/*' 'frontend/dist/*' '*.expo/*' '.claude/*' | head -20 || true)"
          if [ -n "$LEAKED" ]; then
            echo "::error::Build outputs are tracked — gitignore and untrack them:"
            echo "$LEAKED"
            exit 1
          fi
          echo "Clean: no build outputs are tracked."
